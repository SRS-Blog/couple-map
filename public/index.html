<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 手机端：按设备宽度排版（原来是 width=1280，手机上整页被缩到 29%）。
     viewport-fit=cover 让页面铺到刘海和 Home 条底下，safe-area 内边距在 CSS 里补 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 手机浏览器那圈（地址栏 / 状态栏）跟主题走。不写这个，页面切到夜里了，
     上头还挂着一条白天的色，看着像「切了一半」。内容在 applyTheme() 里跟着换 -->
<meta name="theme-color" id="themeColor" content="#fff6f9">
<title>我们的足迹 · 情侣地图</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23cf3a76'/%3E%3Cpath d='M16 24.56C15.12 23.28 6.72 17.36 6.72 12.56C6.72 9.52 9.04 7.44 11.68 7.44C13.28 7.44 14.72 8.48 16 10.92C17.12 8.48 18.56 7.44 20.32 7.44C22.96 7.44 25.28 9.52 25.28 12.56C25.28 17.36 16.88 23.28 16 24.56Z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-theme="rose">

<!-- ============================================================
     图标库：全站统一的线性图标，24×24，圆头圆角。
     形状这里画，颜色不画 —— 一律走 currentColor，跟着所在位置的文字走。
     用法： <svg class="ic"><use href="#ic-xxx"></use></svg>
     纯描边图标不需要写 fill/stroke（.ic 已给默认值）；
     需要实心的部分（播放三角、音符头、骰子点）在形状上单独标 fill="currentColor" stroke="none"。
     ============================================================ -->
<svg class="ic-sprite" aria-hidden="true" focusable="false">
  <!-- 足迹回放：一段虚线足迹 + 播放 -->
  <symbol id="ic-replay" viewBox="0 0 24 24">
    <path d="M3.4 16.6c2.6-6.4 5.8 2 8.8-4.2" stroke-dasharray="2.3 2.7"/>
    <circle cx="3.4" cy="16.6" r="1.5" fill="currentColor" stroke="none"/>
    <path d="M14.8 7.6 20.4 12l-5.6 4.4Z" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- 回忆漫游：骰子 -->
  <symbol id="ic-dice" viewBox="0 0 24 24">
    <rect x="3.6" y="3.6" width="16.8" height="16.8" rx="4.4"/>
    <circle cx="8.7" cy="8.7" r="1.35" fill="currentColor" stroke="none"/>
    <circle cx="12" cy="12" r="1.35" fill="currentColor" stroke="none"/>
    <circle cx="15.3" cy="15.3" r="1.35" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- 回忆墙：两张照片叠着 -->
  <symbol id="ic-gallery" viewBox="0 0 24 24">
    <path d="M7.6 5.8h10.2A2.6 2.6 0 0 1 20.4 8.4v8.4"/>
    <rect x="3.4" y="8.6" width="13.6" height="11.6" rx="2.8"/>
    <circle cx="7.8" cy="12.9" r="1.3" fill="currentColor" stroke="none"/>
    <path d="M4.4 18.8 8.2 14.4l2.7 2.9 2.5-2.2 2.6 3.7"/>
  </symbol>

  <!-- 恋爱年报：柱状图 -->
  <symbol id="ic-report" viewBox="0 0 24 24">
    <path d="M3.8 19.6h16.4"/>
    <rect x="5.2" y="11.4" width="3.6" height="8.2" rx="1.4" fill="currentColor" stroke="none"/>
    <rect x="10.2" y="7.2" width="3.6" height="12.4" rx="1.4" fill="currentColor" stroke="none"/>
    <rect x="15.2" y="3.6" width="3.6" height="16" rx="1.4" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- 主题：月亮 / 太阳 -->
  <symbol id="ic-moon" viewBox="0 0 24 24">
    <path d="M20.6 13.2A8.6 8.6 0 0 1 10.8 3.4 8.7 8.7 0 1 0 20.6 13.2Z"/>
  </symbol>
  <symbol id="ic-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4.1"/>
    <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4 7 7M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6"/>
  </symbol>

  <!-- 设置：三条滑轨 -->
  <symbol id="ic-settings" viewBox="0 0 24 24">
    <path d="M3.6 6.8h5.4M15 6.8h5.4"/>
    <circle cx="12" cy="6.8" r="2.2"/>
    <path d="M3.6 12h9.4M19 12h1.4"/>
    <circle cx="16" cy="12" r="2.2"/>
    <path d="M3.6 17.2h1.4M11 17.2h9.4"/>
    <circle cx="8" cy="17.2" r="2.2"/>
  </symbol>

  <!-- 放大镜 / 回到全国 -->
  <symbol id="ic-search" viewBox="0 0 24 24">
    <circle cx="10.8" cy="10.8" r="6.2"/>
    <path d="M15.4 15.4 20 20"/>
  </symbol>
  <symbol id="ic-globe" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="8.4"/>
    <path d="M12 3.6c-2.5 2.3-3.9 5.1-3.9 8.4s1.4 6.1 3.9 8.4c2.5-2.3 3.9-5.1 3.9-8.4S14.5 5.9 12 3.6Z"/>
    <path d="M4.1 9.4h15.8M4.1 14.6h15.8"/>
  </symbol>

  <!-- 记录卡片上的小图标 -->
  <symbol id="ic-pin" viewBox="0 0 24 24">
    <path d="M12 21.4c-.65-.95-6.5-6.15-6.5-11a6.5 6.5 0 1 1 13 0c0 4.85-5.85 10.05-6.5 11Z"/>
    <circle cx="12" cy="10.2" r="2.35"/>
  </symbol>
  <symbol id="ic-note" viewBox="0 0 24 24">
    <path d="M9.6 16.2V6.4l9-1.8v9.8"/>
    <circle cx="7.2" cy="16.6" r="2.6" fill="currentColor" stroke="none"/>
    <circle cx="16.2" cy="14.4" r="2.6" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="ic-clip" viewBox="0 0 24 24">
    <path d="M18.4 9.8 10.8 17.4a3.6 3.6 0 0 1-5.1-5.1l8.1-8.1a2.5 2.5 0 0 1 3.5 3.5l-8.1 8.1a1.15 1.15 0 0 1-1.6-1.6l7.3-7.3"/>
  </symbol>
  <symbol id="ic-camera" viewBox="0 0 24 24">
    <path d="M4 8.2h2.8l1.4-2.4h7.6l1.4 2.4H20a1.5 1.5 0 0 1 1.5 1.5v7.2A1.5 1.5 0 0 1 20 18.4H4a1.5 1.5 0 0 1-1.5-1.5V9.7A1.5 1.5 0 0 1 4 8.2Z"/>
    <circle cx="12" cy="12.9" r="3.3"/>
  </symbol>
  <symbol id="ic-video" viewBox="0 0 24 24">
    <rect x="2.8" y="5.6" width="18.4" height="12.8" rx="3"/>
    <path d="M10.2 9.4 15 12l-4.8 2.6Z" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="ic-pen" viewBox="0 0 24 24">
    <path d="M15.4 4.6 19.4 8.6 8.6 19.4H4.6v-4L15.4 4.6Z"/>
    <path d="M13.2 6.8 17.2 10.8"/>
  </symbol>

  <!-- 声音 -->
  <symbol id="ic-volume" viewBox="0 0 24 24">
    <path d="M4 9.4h3.2L12 5.4v13.2l-4.8-4H4a1.2 1.2 0 0 1-1.2-1.2v-2.8A1.2 1.2 0 0 1 4 9.4Z"/>
    <path d="M15.6 9.2a4 4 0 0 1 0 5.6M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/>
  </symbol>
  <symbol id="ic-volume-low" viewBox="0 0 24 24">
    <path d="M4 9.4h3.2L12 5.4v13.2l-4.8-4H4a1.2 1.2 0 0 1-1.2-1.2v-2.8A1.2 1.2 0 0 1 4 9.4Z"/>
    <path d="M15.6 9.2a4 4 0 0 1 0 5.6"/>
  </symbol>
  <symbol id="ic-volume-off" viewBox="0 0 24 24">
    <path d="M4 9.4h3.2L12 5.4v13.2l-4.8-4H4a1.2 1.2 0 0 1-1.2-1.2v-2.8A1.2 1.2 0 0 1 4 9.4Z"/>
    <path d="M16 9.6 21 14.4M21 9.6 16 14.4"/>
  </symbol>
  <symbol id="ic-headphones" viewBox="0 0 24 24">
    <path d="M4 15.6v-3.2a8 8 0 0 1 16 0v3.2"/>
    <rect x="2.6" y="14.4" width="4.2" height="6.2" rx="2.1"/>
    <rect x="17.2" y="14.4" width="4.2" height="6.2" rx="2.1"/>
  </symbol>

  <!-- 其他 -->
  <symbol id="ic-download" viewBox="0 0 24 24">
    <path d="M12 3.4v11.2M7.5 10.4 12 14.9l4.5-4.5"/>
    <path d="M4.2 18.2v2h15.6v-2"/>
  </symbol>
  <symbol id="ic-warn" viewBox="0 0 24 24">
    <path d="M12 3.6 21.2 19.6H2.8L12 3.6Z"/>
    <path d="M12 10.2v3.4"/>
    <circle cx="12" cy="16.5" r="1" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="ic-heart" viewBox="0 0 24 24">
    <path d="M12 21.2c-1-1.1-8.2-5.7-8.2-11.1A5 5 0 0 1 12 6.4a5 5 0 0 1 8.2 3.7c0 5.4-7.2 10-8.2 11.1Z" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="ic-bubble" viewBox="0 0 24 24">
    <path d="M4 5.8h16a1.6 1.6 0 0 1 1.6 1.6v8a1.6 1.6 0 0 1-1.6 1.6H10l-4.6 3.8v-3.8H4a1.6 1.6 0 0 1-1.6-1.6v-8A1.6 1.6 0 0 1 4 5.8Z"/>
  </symbol>
  <symbol id="ic-sparkle" viewBox="0 0 24 24">
    <path d="M12 4.4c.9 4.8 2.3 6.2 7.1 7.1-4.8.9-6.2 2.3-7.1 7.1-.9-4.8-2.3-6.2-7.1-7.1 4.8-.9 6.2-2.3 7.1-7.1Z" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- 播放控件 -->
  <symbol id="ic-prev" viewBox="0 0 24 24">
    <path d="M6.4 5.2v13.6"/>
    <path d="M19 5.8 9.6 12l9.4 6.2Z" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="ic-play" viewBox="0 0 24 24">
    <path d="M8.4 5.6 18.2 12l-9.8 6.4Z" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="ic-pause" viewBox="0 0 24 24">
    <rect x="7.4" y="5.4" width="3.4" height="13.2" rx="1.4" fill="currentColor" stroke="none"/>
    <rect x="13.2" y="5.4" width="3.4" height="13.2" rx="1.4" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="ic-next" viewBox="0 0 24 24">
    <path d="M17.6 5.2v13.6"/>
    <path d="M5 5.8 14.4 12 5 18.2Z" fill="currentColor" stroke="none"/>
  </symbol>
  <symbol id="ic-x" viewBox="0 0 24 24">
    <path d="M7 7 17 17M17 7 7 17"/>
  </symbol>
  <symbol id="ic-chev-up" viewBox="0 0 24 24">
    <path d="M5 15l7-7 7 7"/>
  </symbol>
  <symbol id="ic-plus" viewBox="0 0 24 24">
    <path d="M12 7v10M7 12h10"/>
  </symbol>
  <!-- 更多（手机上把顶栏那排文字按钮收进去）：三点，跟 ic-settings 的滑轨区分开 -->
  <symbol id="ic-menu" viewBox="0 0 24 24">
    <circle cx="5.2" cy="12" r="1.55" fill="currentColor" stroke="none"/>
    <circle cx="12" cy="12" r="1.55" fill="currentColor" stroke="none"/>
    <circle cx="18.8" cy="12" r="1.55" fill="currentColor" stroke="none"/>
  </symbol>
</svg>

<div class="bg" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="blob b4"></span>
</div>
<div class="heart-rain" id="heartRain" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark" id="brandMark" aria-hidden="true">
      <svg class="bm-glyph" viewBox="0 0 24 24">
        <defs>
          <linearGradient id="bmFill" x1="7.5" y1="7.6" x2="13" y2="18.6" gradientUnits="userSpaceOnUse">
            <stop offset="0" class="bm-fill-a"/>
            <stop offset=".5" class="bm-fill-b"/>
            <stop offset="1" class="bm-fill-c"/>
          </linearGradient>
        </defs>
        <!-- 一圈轨迹先画，心压在上面：中段被心挡住，只留两头翘出来。
             倾角不在这里写 —— CSS 的 bmSpin 负责从 -20° 起慢慢转一整圈 -->
        <ellipse class="bm-orbit" cx="12" cy="12.6" rx="11" ry="3.4"/>
        <!-- 心形图钉：两瓣是心，底下收成钉尖 -->
        <path fill="url(#bmFill)" d="M12 18.5C11.45 17.6 6.2 13.9 6.2 11C6.2 9.1 7.65 7.8 9.3 7.8C10.4 7.8 11.3 8.45 12 9.5C12.7 8.45 13.6 7.8 14.7 7.8C16.35 7.8 17.8 9.1 17.8 11C17.8 13.9 12.55 17.6 12 18.5Z"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1 id="coupleTitle">我们的足迹</h1>
      <p id="motto">把每一次心动，都钉在地图上。</p>
    </div>
  </div>

  <div class="topbar-actions">
    <!-- 手机上把 4 个文字按钮折进「更多」；桌面用 display:contents 让它们直接当
         topbar-actions 的 flex 子项排开 —— 一套 DOM 一套监听，不用复制按钮 -->
    <button class="btn ghost icon more-btn" id="btnMore" title="更多" aria-expanded="false" aria-haspopup="true"><svg class="ic"><use href="#ic-menu"></use></svg></button>
    <div class="more-menu" id="moreMenu">
      <button class="btn ghost" id="btnReplay"><svg class="ic"><use href="#ic-replay"></use></svg>足迹回放</button>
      <button class="btn ghost" id="btnRandom"><svg class="ic"><use href="#ic-dice"></use></svg>回忆漫游</button>
      <button class="btn ghost" id="btnGallery"><svg class="ic"><use href="#ic-gallery"></use></svg>回忆墙</button>
      <button class="btn ghost" id="btnReport"><svg class="ic"><use href="#ic-report"></use></svg>恋爱年报</button>
    </div>
    <button class="btn ghost icon" id="btnTheme" title="切换白天 / 夜晚"><svg class="ic"><use id="themeUse" href="#ic-moon"></use></svg></button>
    <button class="btn ghost icon" id="btnSettings" title="设置"><svg class="ic"><use href="#ic-settings"></use></svg></button>
  </div>
</header>

<main class="stage">
  <section class="map-wrap" id="mapWrap">
    <nav class="crumbs" id="crumbs"></nav>

    <!-- 手机上「在一起多少天」默认收成一枚横着的天数徽章，点开才展开完整卡 —— 地图是主体 -->
    <button type="button" class="to-badge" id="toBadge" title="看看我们走了多远">
      <span class="tb-pair" id="tbPair"></span>
      <span class="tb-text" id="tbText"></span>
    </button>

    <!-- 在一起纪念卡：两张方头像斜插在顶边上，下面是天数。挂在地图左中，和右侧缩放滑条左右对称 -->
    <div class="together" id="togetherCard">
      <div class="to-pair" id="avatarPair"></div>
      <div class="to-body" id="toBody"></div>
      <button type="button" class="to-close" id="toClose" title="收起"><svg class="ic"><use href="#ic-x"></use></svg></button>
    </div>
    <input type="file" id="avatarInput" accept="image/*" hidden>

    <svg id="map" role="img" aria-label="中国地图"></svg>

    <div class="map-hint" id="mapHint">
      <strong>点击地图上的省份</strong>
      <span>会自然放大，再点进城市和区县，把你们的回忆钉在那里</span>
    </div>

    <div class="map-tools">
      <div class="zoom-slider" title="拖动缩放地图">
        <span class="zs-pct" id="zoomPct">0%</span>
        <div class="zs-wrap">
          <div class="zs-bar" id="zoomBar"></div>
          <input type="range" id="zoomRange" min="0" max="100" step="1" value="0" aria-label="地图缩放">
        </div>
        <span class="zs-icon"><svg class="ic"><use href="#ic-search"></use></svg></span>
      </div>
      <button class="tool" id="btnReset" title="回到全国"><svg class="ic"><use href="#ic-globe"></use></svg></button>
    </div>

    <!-- 图例三档：没去过 / 去过一次 / 去过很多次。地图也按这三档点亮 -->
    <div class="legend">
      <span class="lg"><i class="dot unlit"></i>还没去过</span>
      <span class="lg"><i class="dot lit1"></i>去过1次</span>
      <span class="lg"><i class="dot lit2"></i>去过N次</span>
    </div>

    <!-- 音乐播放器：黑胶唱片挂右下角，点开是歌单 -->
    <div class="player-mount" id="playerMount"></div>

    <div class="map-loading" id="mapLoading"><span class="spin"></span><em>正在展开地图…</em></div>
  </section>

  <aside class="panel" id="panel" aria-hidden="true"></aside>
</main>

<div class="overlay" id="overlay" hidden></div>
<div class="toasts" id="toasts"></div>
<div class="burst-layer" id="burstLayer" aria-hidden="true"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
